<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VELA | Vintage Ruhların Kaliteyle Buluşması</title>

    <style>
    :root {
        --kirk-beyaz: #F4EFE6;
        --turuncu: #C76532;
        --yesil: #435747;
        --koyu-yesil: #29382E;
        --metin: #292C28;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        background-color: var(--kirk-beyaz);
        color: var(--metin);
        font-family: Georgia, "Times New Roman", serif;
    }

    header {
        width: 100%;
        padding: 28px 7%;
        border-bottom: 1px solid rgba(67, 87, 71, 0.2);
    }

    .logo {
        color: var(--yesil);
        font-size: 30px;
        font-weight: bold;
        letter-spacing: 8px;
    }

    main {
        padding: 80px 7%;
    }

    .welcome {
        max-width: 760px;
    }

    .eyebrow {
        margin-bottom: 18px;
        color: var(--turuncu);
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 5px;
    }

    h1 {
        margin-bottom: 18px;
        color: var(--koyu-yesil);
        font-size: clamp(48px, 8vw, 100px);
        font-weight: normal;
        line-height: 0.95;
    }

    .slogan {
        max-width: 520px;
        color: var(--turuncu);
        font-size: 21px;
        font-style: italic;
        line-height: 1.5;
    }
.chat-card {
    max-width: 560px;
    margin-top: 70px;
    padding: 38px;
    background-color: rgba(255, 255, 255, 0.32);
    border: 1px solid rgba(67, 87, 71, 0.18);
    border-radius: 24px;
}

.chat-card h2 {
    margin-bottom: 10px;
    color: var(--koyu-yesil);
    font-size: 38px;
    font-weight: normal;
}

.chat-intro {
    margin-bottom: 26px;
    color: var(--yesil);
    font-family: Arial, sans-serif;
    line-height: 1.6;
}

.chat-box {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.chat-box textarea {
    width: 100%;
    padding: 18px;
    border: 1px solid rgba(67, 87, 71, 0.3);
    border-radius: 16px;
    outline: none;
    resize: vertical;
    background-color: #fffdf8;
    color: var(--metin);
    font-family: Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
}

.chat-box textarea:focus {
    border-color: var(--turuncu);
}

.chat-box button {
    align-self: flex-start;
    padding: 13px 28px;
    border: none;
    border-radius: 999px;
    background-color: var(--turuncu);
    color: white;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.chat-box button:hover {
    opacity: 0.88;
}

.cevap-alani {
    margin-top: 24px;
    padding: 20px;
    min-height: 90px;
    border-left: 3px solid var(--yesil);
    background-color: rgba(67, 87, 71, 0.06);
    color: var(--metin);
    font-family: Arial, sans-serif;
    line-height: 1.7;
    white-space: pre-line;
}
.contact-card {
    max-width: 700px;
    margin-top: 70px;
    padding: 48px;
    border: 1px solid rgba(67, 87, 71, 0.2);
    border-radius: 30px;
    background-color: rgba(255, 255, 255, 0.25);
}

.contact-card h2 {
    margin-top: 12px;
    margin-bottom: 12px;
    color: var(--koyu-yesil);
    font-size: 48px;
    font-weight: normal;
}

.contact-intro {
    margin-bottom: 32px;
    color: var(--yesil);
    font-family: Arial, sans-serif;
    font-size: 18px;
    line-height: 1.6;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: var(--koyu-yesil);
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 16px 18px;
    border: 1px solid rgba(67, 87, 71, 0.3);
    border-radius: 14px;
    background-color: #fffdf8;
    color: var(--metin);
    font-family: Arial, sans-serif;
    font-size: 16px;
    outline: none;
}

.form-group textarea {
    resize: vertical;
    min-height: 120px;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: var(--turuncu);
}


#leadButonu {
    margin-top: 10px;
    width: 180px;
    padding: 15px 30px;
    border: none;
    border-radius: 12px;
    background-color: var(--turuncu);
    color: white;
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s ease;
}

#leadButonu:hover {
    opacity: 0.85;
}

.form-sonucu {
    margin-top: 20px;
    font-family: Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
}
</style>

</head>
<body>

    <header>
        <div class="logo">VELA</div>
    </header>

    <main>
        <section class="welcome">
            <p class="eyebrow">VELA</p>

            <h1>Vela'ya Dokun</h1>

            <p class="slogan">
                Vintage Ruhların Kaliteyle Buluşması
            </p>
        </section>
        <section class="chat-card">
    <p class="eyebrow">YAPAY ZEKA ASİSTANI</p>

    <h2>Vela'ya Sor</h2>

    <p class="chat-intro">
        Aradığın parçayı birlikte bulalım.
    </p>

    <div class="chat-box">
        <textarea
            id="mesaj"
            placeholder="Nasıl bir aksesuar arıyorsun?"
            rows="5"
        ></textarea>

        <button id="sorButonu" type="button">
            Sor
        </button>
    </div>

    <div id="cevapAlani" class="cevap-alani">
        Vela'nın yanıtı burada görünecek.
    </div>
</section>
<section class="contact-card">
    <p class="eyebrow">VELA</p>

    <h2>Vela ile İletişimde Kalın</h2>

    <p class="contact-intro">
        Aradığın parçayı birlikte bulalım. Bilgilerini bırak, seninle iletişime geçelim.
    </p>

    <form id="leadForm">
        <div class="form-group">
            <label for="isim">Adınız</label>
            <input
                type="text"
                id="isim"
                name="isim"
                placeholder="Adınızı yazın"
                required
            >
        </div>

        <div class="form-group">
            <label for="telefon">Telefon</label>
            <input
                type="tel"
                id="telefon"
                name="telefon"
                placeholder="05xx xxx xx xx"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">E-posta</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="ornek@email.com"
                required
            >
        </div>

        <div class="form-group">
            <label for="leadMesaj">Mesajınız</label>
            <textarea
                id="leadMesaj"
                name="mesaj"
                placeholder="Nasıl yardımcı olabiliriz?"
                rows="4"
            ></textarea>
        </div>

        <button type="submit" id="leadButonu">
            Gönder
        </button>

        <div id="formSonucu" class="form-sonucu"></div>
    </form>
</section>
    </main>

<script>
    const mesajAlani = document.getElementById("mesaj");
    const sorButonu = document.getElementById("sorButonu");
    const cevapAlani = document.getElementById("cevapAlani");

    sorButonu.addEventListener("click", async function () {
        const mesaj = mesajAlani.value.trim();

        if (!mesaj) {
            cevapAlani.textContent = "Lütfen önce bir mesaj yaz.";
            return;
        }

        sorButonu.disabled = true;
        sorButonu.textContent = "Düşünüyor...";

        cevapAlani.textContent = "Vela senin için düşünüyor...";

        try {
            const response = await fetch("/api/sohbet", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    mesaj: mesaj
                })
            });

            const data = await response.json();

            if (!response.ok || !data.basari) {
                throw new Error(data.hata || "Bir hata oluştu.");
            }

            cevapAlani.textContent = data.cevap;

        } catch (error) {
            cevapAlani.textContent =
                "Şu anda Vela'ya ulaşılamıyor. Lütfen tekrar dene.";
        } finally {
            sorButonu.disabled = false;
            sorButonu.textContent = "Sor";
        }
    });
</script>

<script>
    const leadForm = document.getElementById("leadForm");
    const leadButonu = document.getElementById("leadButonu");
    const formSonucu = document.getElementById("formSonucu");

    leadForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const isim = document.getElementById("isim").value.trim();
        const telefon = document.getElementById("telefon").value.trim();
        const email = document.getElementById("email").value.trim();
        const mesaj = document.getElementById("leadMesaj").value.trim();

        leadButonu.disabled = true;
        leadButonu.textContent = "Gönderiliyor...";

        try {
            const response = await fetch("/api/leads", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    isim: isim,
                    telefon: telefon,
                    email: email,
                    mesaj: mesaj
                })
            });

            const data = await response.json();

            if (!response.ok || !data.basari) {
                throw new Error(data.hata || "Bir hata oluştu.");
            }

            formSonucu.textContent = "Teşekkürler! Bilgilerin başarıyla alındı.";
            leadForm.reset();

        } catch (error) {
            formSonucu.textContent =
                "Bilgiler gönderilemedi. Lütfen tekrar dene.";
        } finally {
            leadButonu.disabled = false;
            leadButonu.textContent = "Gönder";
        }
    });
</script>

</body>
</html>
